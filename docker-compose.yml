services:
  asistente-tickets:
    build:
      context: .
      dockerfile: Dockerfile
    image: asistente-tickets:1.0.0
    container_name: asistente-tickets
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      CONFIDENCE_THRESHOLD: "${CONFIDENCE_THRESHOLD:-0.50}"
      MODEL_DEVICE: "cpu"
      HF_HOME: "/home/app/.cache/huggingface"
      HF_HUB_DISABLE_TELEMETRY: "1"
      CORS_ORIGINS: "${CORS_ORIGINS:-}"
    volumes:
      - hf-cache:/home/app/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

volumes:
  hf-cache:
